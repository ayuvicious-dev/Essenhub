<style>
:root{--bg:#eef3fa;--sf:#fff;--ink:#14243f;--mut:#667791;--ln:#d9e3f2;--pr:#5b98f1;--prd:#2f6fd6;--pri:#e6f0ff}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:3px solid var(--pr)}
.bar{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand img{width:32px;height:32px}
#q{margin-left:auto;width:100%;max-width:320px;padding:9px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:inherit;font:inherit}
main{max-width:1040px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;text-decoration:none;color:inherit;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px 10px 14px}
.app:hover{background:var(--pri)}
.ic{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:800;background:hsl(var(--h) 62% 52%)}
.grid:empty::before{content:"Belum ada aplikasi";color:var(--mut);font-size:13px;grid-column:1/-1;text-align:center;padding:40px 0}
.app b{line-height:1.25}
.app small{color:var(--mut);font-size:12px}
@media(max-width:520px){.bar .brand span{display:none}.grid{grid-template-columns:repeat(2,1fr)}}
/* Login */
.auth{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px}
.auth form{width:100%;max-width:360px;margin:0 auto;background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:26px}
.auth form{text-align:center}
.auth img{display:block;margin:0 auto;width:44px;height:44px}
.auth h1{margin:8px 0 2px;font-size:22px;letter-spacing:-.02em}
.auth p{margin:0 0 6px;color:var(--mut)}
.auth label,dialog label{display:block;margin-top:12px;font-size:13px;font-weight:600;color:var(--mut)}
.auth input{text-align:center}
.auth input,dialog input{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:inherit;font:inherit}
.btn{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--pr);color:#fff}
.btn:hover{background:var(--prd)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--ln)}
.auth .btn{width:100%;margin-top:16px}
.link{background:none;border:0;padding:6px 0;margin-top:6px;color:var(--prd);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.err{min-height:20px;margin:8px 0 0;color:#d64545;font-size:13px}
.note{max-width:1040px;margin:16px auto 0;padding:10px 16px;color:var(--mut);font-size:14px;text-align:center}
/* Tambah aplikasi */
.tile{position:relative}.tile .app{height:100%}
.ic{overflow:hidden}.ic img{width:100%;height:100%;object-fit:cover}.ic:has(img){background:var(--pri)}
.x{position:absolute;top:6px;right:6px;width:28px;height:28px;border:0;border-radius:9px;background:none;color:var(--mut);cursor:pointer;font-size:13px}
.x:hover{background:var(--pri);color:#d64545}
dialog{border:0;border-radius:22px;padding:24px;width:min(400px,92vw);background:var(--sf);color:var(--ink);box-shadow:0 20px 60px rgba(10,20,40,.3)}
dialog::backdrop{background:rgba(10,20,40,.45)}
.hint{margin:0 0 6px;color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.sym{width:40px;height:40px;padding:0;display:grid;place-items:center;flex:none}
.sym svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* Mode kelola: saat mati, tombol tambah dan hapus disembunyikan (CSS saja) */
.sw{position:relative;display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--mut);flex:none}
.sw svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sw input{position:absolute;opacity:0;pointer-events:none}
.trk{width:42px;height:24px;border-radius:99px;background:var(--ln);position:relative;transition:background .15s}
.trk::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked~.trk{background:var(--pr)}
.sw input:checked~.trk::after{transform:translateX(18px)}
.sw input:checked~svg{color:var(--prd)}
.sw input:focus-visible~.trk{outline:3px solid var(--pr);outline-offset:2px}
body:has(#kelola:not(:checked)) #add,body:has(#kelola:not(:checked)) #bak,body:has(#kelola:not(:checked)) .x{display:none}
#bk{width:100%;min-height:150px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--ln);border-radius:12px;padding:10px;resize:vertical;color:var(--ink);background:#fff;box-sizing:border-box}
</style>
</head>

    <h1>Masuk ke Essenhub</h1>
    <p>Gunakan akun yang didaftarkan admin.</p>
    <label for="em">Email</label><input id="em" type="email" autocomplete="email" required>
    <label for="pw">Kata sandi</label><input id="pw" type="password" autocomplete="current-password" required>
    <p class="err" id="err" role="alert"></p>
    <button class="btn">Masuk</button>
    <button type="button" class="link" id="forgot">Lupa kata sandi?</button>
  </form>
</section>

<main id="app" hidden>
  <!--
    CARA MENAMBAH APLIKASI: salin satu baris contoh ini, tempel di dalam <div class="grid"> di bawah,
    lalu ganti link, angka warna --h (0-360), huruf awal, nama, dan keterangan:
    <a class="app" href="https://USERNAME.github.io/nama-app/" target="_blank" rel="noopener"><span class="ic" style="--h:205">N</span><b>Nama aplikasi</b><small>Keterangan singkat</small></a>
  -->
  <div class="grid"></div>
</main>

<dialog id="bdlg">
  <form id="bf" method="dialog">
    <h2 style="margin:0 0 4px;font-size:20px">Cadangan / impor</h2>
    <p class="hint">Salin daftar aplikasi di browser ini, lalu tempel di Essenhub versi GitHub dan tekan Impor. Link yang sudah ada dilewati.</p>
    <textarea id="bk" spellcheck="false" aria-label="Data aplikasi (JSON)"></textarea>
    <p class="err" id="berr" role="alert"></p>
    <div class="row"><button type="button" class="btn ghost" id="bx">Tutup</button><button type="button" class="btn ghost" id="bc">Salin</button><button type="button" class="btn" id="bi">Impor</button></div>
  </form>
</dialog>

<dialog id="dlg">
  <form id="nf">
    <h2 style="margin:0 0 4px;font-size:20px">Tambah aplikasi</h2>
    <p class="hint">Tempel link aplikasi. Logo dan nama diambil otomatis.</p>
    <label for="nu">Link aplikasi</label><input id="nu" inputmode="url" autocomplete="off" placeholder="https://username.github.io/nama-app/" required>
    <label for="nn">Nama (opsional)</label><input id="nn" maxlength="40" autocomplete="off">
    <p class="err" id="nerr" role="alert"></p>
    <div class="row"><button type="button" class="btn ghost" id="nx">Batal</button><button class="btn" id="ns">Simpan</button></div>
  </form>
</dialog>

<script>
/* Kerangka halaman murni HTML; skrip ini hanya untuk daftar aplikasi, tambah/hapus, dan pencarian. */
var $=function(id){return document.getElementById(id)},q=$('q'),b=$('boot'),g=document.querySelector('.grid');q.hidden=false;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function host(u){try{return new URL(u).host}catch(e){return u}}
function hue(s){var h=7;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function dir(u){try{var x=new URL(u);x.search=x.hash='';x.pathname=x.pathname.replace(/[^/]*\.[a-z0-9]+$/i,'');if(!/\/$/.test(x.pathname))x.pathname+='/';return x}catch(e){return null}}
function render(list){
  window.__cur=list||[];
  g.innerHTML=(list||[]).map(function(a){var l=(a.name||'?').charAt(0).toUpperCase();
    return '<div class="tile"><a class="app" href="'+esc(a.url)+'" target="_blank" rel="noopener"><span class="ic" style="--h:'+hue(a.name||'?')+'">'
    +(a.icon?'<img src="'+esc(a.icon)+'" alt="'+esc(l)+'" referrerpolicy="no-referrer" onerror="this.replaceWith(this.alt)">':esc(l))
    +'</span><b>'+esc(a.name)+'</b></a><button class="x" data-del="'+esc(a.id)+'" aria-label="Hapus '+esc(a.name)+'" title="Hapus">✕</button></div>'}).join('');
}
/* Cari nama dan logo dari manifest.json aplikasi tujuan; jika tidak ada, tebak icons/icon-192.png. */
async function probe(u){
  var d=dir(u),r={name:'',icon:''};if(!d)return r;
  var mu=new URL('manifest.json',d).href;
  try{var m=await (await fetch(mu)).json();r.name=m.short_name||m.name||'';
    var ic=(m.icons||[]).filter(function(i){return!/maskable/.test(i.purpose||'')}).map(function(i){return{s:parseInt(i.sizes)||0,src:i.src}}).sort(function(a,b){return a.s-b.s});
    var best=ic.find(function(i){return i.s>=128})||ic[ic.length-1];
    if(best)r.icon=new URL(best.src,mu).href}catch(e){}
  if(!r.icon)r.icon=new URL('icons/icon-192.png',d).href;
  return r}
q.oninput=function(){var v=q.value.toLowerCase();document.querySelectorAll('.tile').forEach(function(t){t.hidden=t.textContent.toLowerCase().indexOf(v)<0})};
g.onclick=function(e){var x=e.target.closest('[data-del]');if(x&&window.store&&confirm('Hapus aplikasi ini dari Essenhub?'))window.store.remove(x.dataset.del)};
var dlg=$('dlg'),nf=$('nf');
$('add').onclick=function(){nf.reset();$('nerr').textContent='';dlg.showModal();$('nu').focus()};
$('nx').onclick=function(){dlg.close()};
nf.onsubmit=async function(e){
  e.preventDefault();var u=$('nu').value.trim(),x,btn=$('ns');
  if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;
  try{x=new URL(u);if(!/^https?:$/.test(x.protocol))throw 0}catch(z){$('nerr').textContent='Link tidak valid.';return}
  btn.disabled=true;btn.textContent='Mengambil logo…';$('nerr').textContent='';
  var p=await probe(u);
  try{await window.store.add({name:$('nn').value.trim()||p.name||x.host,url:u,icon:p.icon});dlg.close()}
  catch(z){$('nerr').textContent='Gagal menyimpan. Coba lagi.'}
  btn.disabled=false;btn.textContent='Simpan'};
/* Cadangan / impor daftar aplikasi (JSON) */
var bd=$('bdlg'),bk=$('bk'),be=$('berr');
var exp=function(){return JSON.stringify((window.__cur||[]).map(function(a){return{name:a.name,url:a.url,icon:a.icon||''}}),null,1)};
$('bak').onclick=function(){bk.value=exp();be.textContent='';be.style.color='';bd.showModal()};
$('bx').onclick=function(){bd.close()};
$('bc').onclick=async function(){bk.value=exp();bk.select();try{await navigator.clipboard.writeText(bk.value);be.style.color='';be.textContent='Disalin.'}catch(e){be.textContent='Teks sudah terpilih, salin manual.'}};
$('bi').onclick=async function(){
  var arr;try{arr=JSON.parse(bk.value);if(!Array.isArray(arr))throw 0}catch(e){be.style.color='';be.textContent='Format data tidak valid.';return}
  if(!window.store){be.textContent='Belum siap, coba lagi sebentar.';return}
  var have={};(window.__cur||[]).forEach(function(a){have[a.url]=1});var n=0;
  for(var i=0;i<arr.length;i++){var a=arr[i];if(!a||!a.url||have[a.url])continue;have[a.url]=1;
    try{await window.store.add({name:a.name||host(a.url),url:a.url,icon:a.icon||''});n++;await new Promise(function(r){setTimeout(r,5)})}catch(e){be.textContent='Gagal menyimpan sebagian data.';return}}
  be.style.color='';be.textContent=n+' aplikasi diimpor.'};
/* Ingat pilihan mode kelola di browser ini (bawaan: mati) */
var kl=$('kelola');try{kl.checked=localStorage.getItem('essenhub_kelola')==='1'}catch(e){}
kl.onchange=function(){try{localStorage.setItem('essenhub_kelola',kl.checked?'1':'0')}catch(e){}};
if(location.protocol==='file:'){
  /* Pratinjau lokal: login dan daftar aplikasi disimpan di browser ini (localStorage). Akun tidak diperiksa. */
  var K='essenhub_pratinjau',D='essenhub_apps';
  var loc=function(){try{return JSON.parse(localStorage.getItem(D)||'[]')}catch(e){return[]}};
  var sv=function(l){try{localStorage.setItem(D,JSON.stringify(l))}catch(e){}render(l)};
  window.store={add:function(a){var l=loc();a.id=String(Date.now());l.push(a);sv(l)},remove:function(id){sv(loc().filter(function(x){return x.id!==id}))}};
  var show=function(){$('auth').hidden=true;$('app').hidden=false;$('top').hidden=false;$('out').hidden=false;render(loc())};
  b.hidden=true;
  try{if(localStorage.getItem(K))show();else $('auth').hidden=false}catch(e){$('auth').hidden=false}
